# Taxonomía fija de labels para claude-tetris.
# Fuente de verdad: sincronizada a GitHub por .github/workflows/sync-labels.yml
# El workflow de triage (.github/workflows/claude-issue-triage.yml) SOLO puede
# asignar labels de este archivo.

# --- type: qué tipo de issue es (elegir exactamente uno) ---
- name: "type:bug"
  color: "d73a4a"
  description: "Algo no funciona como debería"
- name: "type:feature"
  color: "a2eeef"
  description: "Nueva funcionalidad"
- name: "type:enhancement"
  color: "0e8a16"
  description: "Mejora de algo que ya existe"
- name: "type:docs"
  color: "0075ca"
  description: "Documentación (README, CLAUDE.md, comentarios)"
- name: "type:question"
  color: "d876e3"
  description: "Pregunta o duda, no requiere código"
- name: "type:chore"
  color: "cfd3d7"
  description: "Mantenimiento, tooling, CI, sin impacto funcional"

# --- area: qué parte del juego toca (uno o varios) ---
- name: "area:gameplay"
  color: "1d76db"
  description: "loop, lockPiece, spawn, clearLines, pausa/resume"
- name: "area:rendering"
  color: "1d76db"
  description: "draw, drawNext, ghostY, canvas"
- name: "area:input"
  color: "1d76db"
  description: "listener de keydown, controles de teclado"
- name: "area:scoring"
  color: "1d76db"
  description: "LINE_SCORES, level, dropInterval"
- name: "area:collision"
  color: "1d76db"
  description: "collide, tryRotate, rotateCW, wall kicks"
- name: "area:ui"
  color: "1d76db"
  description: "index.html, style.css, HUD"
- name: "area:ci"
  color: "1d76db"
  description: "GitHub Actions, workflows"

# --- priority: urgencia (elegir exactamente uno) ---
- name: "priority:critical"
  color: "b60205"
  description: "Bloquea el juego o lo rompe por completo"
- name: "priority:high"
  color: "d93f0b"
  description: "Afecta la experiencia de forma notoria"
- name: "priority:medium"
  color: "fbca04"
  description: "Molesto pero no bloqueante"
- name: "priority:low"
  color: "c2e0c6"
  description: "Cosmético o poco frecuente"

# --- complexity: tamaño estimado del cambio (elegir exactamente uno) ---
- name: "complexity:trivial"
  color: "ededed"
  description: "Cambio de una línea, sin riesgo"
- name: "complexity:small"
  color: "ededed"
  description: "Cambio acotado a una función/archivo"
- name: "complexity:medium"
  color: "ededed"
  description: "Toca varias funciones o archivos"
- name: "complexity:large"
  color: "ededed"
  description: "Requiere rediseñar una parte del sistema"

# --- control: gestión del propio workflow de triage ---
- name: "needs-info"
  color: "fbca04"
  description: "Falta información para poder diagnosticar el issue"
- name: "skip-triage"
  color: "ededed"
  description: "Excluye este issue del triage automático de Claude"
